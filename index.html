<body>

  <div class="Loading">

    <button id="WelcomeApp" onclick="OpenWelcomeTab()">

  </div>

      <button id="CloseButton" onclick="CloseCalculatorTab(), MinimizeCalculatorTab()">X</button>

      <iframe width="219" height="302" src="https://calculator-1.com/outdoor/?f=666666&r=ffffff" scrolling="no" frameborder="0"></iframe><br /><a href="https://calculator-1.com/"></a>
    </div>
  </div>

  <div class="FooterLock">

    <div class="Footer">
      <button id="WelcomeApp" onclick="OpenWelcomeTab()">
        <h1>Hi</h1>
      </button>

      <button id="CalculatorApp" onclick="OpenCalculatorTab()">
      <img src="Calculator.png">
    </button>
    </div>

  </div>
